name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug! Please fill in the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I parse a PDF, the Review tab stays empty...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Import / parsing
        - Review & edit
        - Prototype
        - Jira
        - Server / model connection
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Local model
      description: Which Ollama model are you running? (from your .env OLLAMA_MODEL)
      placeholder: phi3.5
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version (node -v), browser.
      placeholder: macOS 14, Node 20.11, Chrome 125
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Paste any console or server output. Please remove secrets (never paste your Jira token).
      render: shell
